[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openal-explore"
version = "0.1.0"
description = "An interactive PySide6 spatial audio playground for openal-py"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "openal-py>=0.1.1", "soundfile>=0.12", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
openal-explore = "openal_explore.app:main"

[tool.setuptools.packages.find]
include = ["openal_explore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
